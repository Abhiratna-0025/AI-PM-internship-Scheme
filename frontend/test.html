<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherGPT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0b1220;color:#f8fafc}
body{display:flex;justify-content:center}
.app{width:100%;max-width:900px;min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 24px;border-bottom:1px solid #263247;background:#111a2b}
.logo{font-size:22px;font-weight:700}.sub{color:#94a3b8;font-size:13px;margin-top:4px}
#chat{flex:1;padding:28px 20px 130px;overflow-y:auto}
.welcome{text-align:center;margin:15vh auto 0;max-width:600px}
.welcome h1{font-size:36px;margin:0 0 10px}.welcome p{color:#94a3b8}
.message{display:flex;margin:16px 0}.message.user{justify-content:flex-end}
.bubble{max-width:78%;padding:13px 16px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
.user .bubble{background:#2563eb;border-bottom-right-radius:5px}
.assistant .bubble{background:#182338;border:1px solid #293750;border-bottom-left-radius:5px}
.error .bubble{border-color:#7f1d1d;color:#fecaca}
.typing{color:#94a3b8;font-style:italic}
.forecast{margin:8px 0 20px 0;padding:16px;border:1px solid #293750;background:#111a2b;border-radius:18px}
.forecast-title{font-weight:700;margin-bottom:12px}.forecast-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.day{background:#182338;border:1px solid #293750;border-radius:14px;padding:13px}
.date{font-weight:700}.desc{color:#cbd5e1;margin:7px 0}
.small{font-size:13px;color:#94a3b8;line-height:1.6}
.composer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0b1220 25%);padding:24px 20px 20px}
.composer-inner{max-width:860px;margin:auto;display:flex;gap:10px;background:#111a2b;border:1px solid #334155;border-radius:18px;padding:10px}
textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:10px}
button{border:0;border-radius:12px;background:#2563eb;color:white;padding:0 20px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{text-align:center;color:#64748b;font-size:11px;margin-top:7px}
@media(max-width:600px){.bubble{max-width:88%}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🌦️ WeatherGPT</div>
  <div class="sub">Ask anything about the weather</div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>How's the weather?</h1>
    <p>Ask about current weather, rain, temperature, wind, or forecasts for any location.</p>
  </div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="prompt" placeholder="Ask WeatherGPT..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</div>
</div>

<script>
const API_BASE = "http://localhost:8080";
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function scrollBottom(){
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
}

function addMessage(text, type="assistant", error=false){
  if(welcome) welcome.style.display="none";
  const row=document.createElement("div");
  row.className=`message ${type}${error ? " error" : ""}`;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML=escapeHtml(text).replace(/\n/g,"<br>");
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return row;
}

function addTyping(){
  return addMessage("WeatherGPT is thinking…","assistant");
}

function addForecast(forecast){
  if(!forecast || !Array.isArray(forecast.days) || forecast.days.length===0) return;

  const box=document.createElement("div");
  box.className="forecast";

  const location=forecast.location?.name || "Forecast";
  box.innerHTML=`
    <div class="forecast-title">📍 ${escapeHtml(location)} forecast</div>
    <div class="forecast-grid">
      ${forecast.days.map(day => `
        <div class="day">
          <div class="date">${escapeHtml(day.date)}</div>
          <div class="desc">${escapeHtml(day.weatherDescription || "Weather")}</div>
          <div><b>${day.tempMin ?? "—"}°C</b> – <b>${day.tempMax ?? "—"}°C</b></div>
          <div class="small">
            🌧️ Rain chance: ${day.precipitationProbabilityMax ?? "—"}%<br>
            💧 Humidity: ${day.humidityMax ?? "—"}%<br>
            💨 Wind: ${day.windSpeedMax ?? "—"} km/h
          </div>
        </div>
      `).join("")}
    </div>`;

  chat.appendChild(box);
  scrollBottom();
}

async function sendPrompt(){
  const message=promptBox.value.trim();
  if(!message || sendButton.disabled) return;

  addMessage(message,"user");
  promptBox.value="";
  resizeTextarea();
  sendButton.disabled=true;

  const typing=addTyping();

  try{
    const response=await fetch(`${API_BASE}/api/chat/query`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Accept":"application/json"
      },
      body:JSON.stringify({message})
    });

    const raw=await response.text();
    typing.remove();

    console.log("WeatherGPT HTTP status:",response.status);
    console.log("WeatherGPT raw response:",raw);

    let json=null;
    try{
      json=JSON.parse(raw);
    }catch(parseError){
      addMessage(
        `The server returned an invalid JSON response.\nHTTP ${response.status}\n\n${raw || "(empty response)"}`,
        "assistant", true
      );
      return;
    }

    if(!response.ok){
      addMessage(
        json?.message || json?.error || `Request failed with HTTP ${response.status}.`,
        "assistant", true
      );
      return;
    }

    // Exact backend envelope:
    // { success: true, message: "Query processed", data: { answer, forecast, ... } }
    const data=json && json.data ? json.data : json;

    if(json?.success === false){
      addMessage(json?.message || "The server could not process the query.","assistant",true);
      return;
    }

    const answer=data?.answer;

    if(!answer){
      addMessage(
        `The API responded, but no "data.answer" was found.\n\nReceived:\n${JSON.stringify(json,null,2)}`,
        "assistant", true
      );
      return;
    }

    addMessage(answer,"assistant");
    addForecast(data.forecast);

  }catch(error){
    typing.remove();
    console.error("WeatherGPT request error:",error);

    addMessage(
      `Could not connect to the backend.\n\nMake sure Spring Boot is running at ${API_BASE}.\n\nError: ${error.message}`,
      "assistant", true
    );
  }finally{
    sendButton.disabled=false;
    promptBox.focus();
  }
}

function resizeTextarea(){
  promptBox.style.height="auto";
  promptBox.style.height=Math.min(promptBox.scrollHeight,140)+"px";
}

sendButton.addEventListener("click",sendPrompt);

promptBox.addEventListener("input",resizeTextarea);

promptBox.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendPrompt();
  }
});

resizeTextarea();
promptBox.focus();
</script>
</body>
</html>
